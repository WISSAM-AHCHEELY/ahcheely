<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.cloudinary.com; img-src https://res.cloudinary.com;">
<title>اختبار رفع مؤقت</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; line-height: 1.6; max-width: 640px; margin-inline: auto; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  .note { border: 1px solid #b58900; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 0.9rem; }
  .row { margin: 12px 0; }
  input[type="file"] { width: 100%; }
  button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #888; cursor: pointer; margin-inline-end: 8px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #start { background: #c8102e; color: #fff; border-color: #c8102e; }
  .status { margin: 12px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #888; min-height: 1.5em; }
  .status.ok { border-color: #2e7d32; }
  .status.err { border-color: #c62828; }
  .status.busy { border-color: #1565c0; }
  ol { padding-inline-start: 20px; }
  li.pass::marker { content: "✔ "; }
  li.fail::marker { content: "✘ "; }
  .res div { margin: 6px 0; word-break: break-all; }
  .res b { display: inline-block; min-width: 7em; }
  img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 8px; }
</style>
</head>
<body>
<h1>اختبار رفع مؤقت إلى Cloudinary</h1>
<div class="note">
  صفحة تشخيص مؤقتة وليست جزءاً من التطبيق. فحوص الحجم والصيغة والبيانات تجري في المتصفح فقط وهي قابلة للتجاوز، وليست حماية خادمية.
  الحد البرمجي: 1 ميغابايت، الصيغ: JPG وJPEG وPNG وWEBP. لا يبدأ أي رفع إلا بعد اختيار صورة والضغط على زر الاختبار.
</div>

<div class="row">
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  <div id="info" class="row"></div>
</div>

<div class="row">
  <button id="start" type="button" disabled>ابدأ الاختبار</button>
  <button id="reset" type="button">مسح</button>
</div>

<div id="status" class="status" role="status" aria-live="polite"></div>
<ol id="checks"></ol>
<div id="result" class="res"></div>

<script type="module">
'use strict';

const CLOUD_NAME = 'drgqkbnrt';
const UPLOAD_PRESET = 'ahcheely_test_unsigned';
const MAX_BYTES = 1048576;
const ALLOWED_EXT = ['jpg', 'jpeg', 'png', 'webp'];
const ALLOWED_MIME = ['image/jpeg', 'image/png', 'image/webp'];
const ENDPOINT = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
const PREVIEW_PREFIX = 'https://res.cloudinary.com/' + CLOUD_NAME + '/';
const TIMEOUT_MS = 30000;

const fileInput = document.getElementById('file');
const infoEl = document.getElementById('info');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const statusEl = document.getElementById('status');
const checksEl = document.getElementById('checks');
const resultEl = document.getElementById('result');

let busy = false;

function clearEl(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

function addCheck(label, ok, detail) {
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = label + ' — ' + (ok ? 'نجح' : 'فشل') + (detail ? ' (' + detail + ')' : '');
  checksEl.appendChild(li);
}

function fmtSize(bytes) {
  return bytes + ' بايت (' + (bytes / 1024).toFixed(1) + ' كيلوبايت)';
}

function detectType(b) {
  if (b.length >= 3 && b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'jpeg';
  if (b.length >= 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47 &&
      b[4] === 0x0D && b[5] === 0x0A && b[6] === 0x1A && b[7] === 0x0A) return 'png';
  if (b.length >= 12 &&
      b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
      b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'webp';
  return null;
}

function extOf(name) {
  const i = name.lastIndexOf('.');
  return i === -1 ? '' : name.slice(i + 1).toLowerCase();
}

async function validate(file) {
  let allOk = true;

  const nonEmpty = file.size > 0;
  addCheck('الملف غير فارغ', nonEmpty, fmtSize(file.size));
  allOk = allOk && nonEmpty;

  const sizeOk = file.size > 0 && file.size <= MAX_BYTES;
  addCheck('الحجم لا يتجاوز 1 ميغابايت', sizeOk, fmtSize(file.size));
  allOk = allOk && sizeOk;

  const ext = extOf(file.name);
  const extOk = ALLOWED_EXT.indexOf(ext) !== -1;
  addCheck('الامتداد مسموح', extOk, ext ? ext : 'بلا امتداد');
  allOk = allOk && extOk;

  const mimeOk = ALLOWED_MIME.indexOf(file.type) !== -1;
  addCheck('نوع MIME مسموح', mimeOk, file.type ? file.type : 'غير معروف');
  allOk = allOk && mimeOk;

  let detected = null;
  try {
    const buf = await file.slice(0, 12).arrayBuffer();
    detected = detectType(new Uint8Array(buf));
  } catch (e) {
    detected = null;
  }
  const expected = (ext === 'jpg' || ext === 'jpeg') ? 'jpeg' : ext;
  const magicOk = detected !== null && detected === expected;
  addCheck('البايتات الأولى تطابق الصيغة', magicOk, detected ? 'اكتُشف: ' + detected : 'لم يُتعرف على الصيغة');
  allOk = allOk && magicOk;

  return allOk;
}

async function upload(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);

  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', body: fd, signal: ctrl.signal });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      const msg = data && data.error && data.error.message ? data.error.message : 'HTTP ' + res.status;
      throw new Error(String(msg).slice(0, 200));
    }
    if (!data) throw new Error('رد غير مفهوم من الخادم');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function addResultRow(label, value) {
  const row = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = label + ': ';
  const span = document.createElement('span');
  span.textContent = String(value);
  row.appendChild(b);
  row.appendChild(span);
  resultEl.appendChild(row);
}

function showResult(data, localSize) {
  clearEl(resultEl);
  addResultRow('public_id', data.public_id);
  addResultRow('asset_id', data.asset_id);
  addResultRow('format', data.format);
  addResultRow('bytes (الخادم)', data.bytes);
  addResultRow('bytes (محلي)', localSize);
  if (data.asset_folder !== undefined) addResultRow('asset_folder', data.asset_folder);
  addResultRow('created_at', data.created_at);
  addResultRow('secure_url', data.secure_url);

  if (typeof data.secure_url === 'string' && data.secure_url.indexOf(PREVIEW_PREFIX) === 0) {
    const img = document.createElement('img');
    img.alt = 'معاينة الصورة المرفوعة';
    img.src = data.secure_url;
    resultEl.appendChild(img);
  } else {
    addResultRow('معاينة', 'لم تُعرض لأن الرابط ليس من النطاق المتوقع');
  }
}

function resetAll() {
  fileInput.value = '';
  clearEl(infoEl);
  clearEl(checksEl);
  clearEl(resultEl);
  setStatus('', '');
  startBtn.disabled = true;
}

fileInput.addEventListener('change', function () {
  clearEl(checksEl);
  clearEl(resultEl);
  setStatus('', '');
  const f = fileInput.files && fileInput.files[0];
  if (!f) {
    infoEl.textContent = '';
    startBtn.disabled = true;
    return;
  }
  infoEl.textContent = 'الملف المختار: ' + f.name + ' — ' + fmtSize(f.size);
  startBtn.disabled = false;
});

resetBtn.addEventListener('click', function () {
  if (busy) return;
  resetAll();
});

startBtn.addEventListener('click', async function () {
  if (busy) return;
  const file = fileInput.files && fileInput.files[0];
  if (!file) {
    setStatus('اختر صورة أولاً.', 'err');
    return;
  }

  busy = true;
  startBtn.disabled = true;
  resetBtn.disabled = true;
  clearEl(checksEl);
  clearEl(resultEl);

  try {
    setStatus('جارٍ فحص الملف في المتصفح...', 'busy');
    const ok = await validate(file);
    if (!ok) {
      setStatus('توقف الاختبار: فشل فحص واحد على الأقل، ولم يُرسل أي طلب إلى Cloudinary.', 'err');
      return;
    }

    setStatus('نجحت الفحوص. جارٍ الرفع إلى Cloudinary...', 'busy');
    const data = await upload(file);
    showResult(data, file.size);
    setStatus('نجح الرفع. تذكّر: احذف الصورة التجريبية يدوياً من Cloudinary (Assets) بعد التحقق.', 'ok');
  } catch (e) {
    let msg = e && e.message ? e.message : 'خطأ غير معروف';
    if (e && e.name === 'AbortError') msg = 'انتهت مهلة الطلب (30 ثانية).';
    setStatus('فشل الرفع: ' + msg, 'err');
  } finally {
    busy = false;
    resetBtn.disabled = false;
    startBtn.disabled = !(fileInput.files && fileInput.files[0]);
  }
});
</script>
</body>
</html>
