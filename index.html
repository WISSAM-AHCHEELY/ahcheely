<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>أحچيلي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/">أحچيلي</a>
  <span class="badge">نسخة تأسيسية</span>
</header>
<noscript><div class="mock">يتطلب أحچيلي تفعيل JavaScript.</div></noscript>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="التنقل"></nav>
<div id="errbox" role="alert" hidden></div>
<script>
(function () {
  var box = document.getElementById('errbox');
  var FAIL = 'تعذّر تشغيل التطبيق. تحقق من اتصالك وحدّث الصفحة، وإن استمر ذلك فحاول لاحقاً.';
  var SLOW = 'التطبيق يتأخر عن المعتاد، وقد يكون اتصالك بطيئاً. إن استمر ذلك فحدّث الصفحة.';
  function show(text, kind) {
    if (!box.hidden && box.getAttribute('data-kind') !== 'boot') return;
    box.textContent = text;
    box.setAttribute('data-kind', kind);
    box.hidden = false;
  }
  var timer = setTimeout(function () {
    if (!window.__ahcheelyBooted && box.hidden) show(SLOW, 'boot');
  }, 8000);
  import('./app.js').then(function () {
    clearTimeout(timer);
    if (box.getAttribute('data-kind') === 'boot') box.hidden = true;
  }, function (err) {
    console.error('[أحچيلي] تعذّر تحميل التطبيق', err);
    clearTimeout(timer);
    show(FAIL, 'load');
  });
})();
</script>
</body>
</html>
